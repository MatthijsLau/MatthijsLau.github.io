name: Generate HTML Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'assets/data/**'
      - 'templates/**'
      - '*_generate.py'
      - '.github/workflows/generate-pages.yml'
  schedule:
    - cron: '0 0 18 4 *'  # Run when Apr 18, 2026 event ends (auto-updated)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Validate data files
        run: python validate_data.py
      
      - name: Generate HTML pages
        run: python generate_all.py
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push generated files
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u
          git commit -m "chore: regenerate HTML pages from data [skip ci]"
          git push
      
      - name: Summary
        run: |
          echo "✅ HTML pages generated successfully!"
          echo "Generated files:"
          git diff --name-only HEAD~1..HEAD | grep -E "\.html$" || echo "  No HTML changes"
